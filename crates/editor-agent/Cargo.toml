[package]
name = "editor-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
editor-core = { path = "../editor-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tempfile = "3.27"
schemars = { version = "1.2.1", features = ["uuid1"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[[example]]
name = "provider-fault-fixture"
path = "examples/provider_fault_fixture.rs"
test = false
bench = false
