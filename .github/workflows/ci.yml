# Adapted from Neptune Terminal: identical pinned actions, toolchain and gate policy.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # New commits replace only runs for the same PR; main pushes stay independent.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # PRs compare the merge commit with its first parent.
          fetch-depth: 2
      - name: Classify changes
        id: changes
        shell: python
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          import os
          from pathlib import Path
          import subprocess

          base = 'HEAD^1'
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              base = os.environ['PUSH_BEFORE_SHA']
              if base != '0' * 40:
                  subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', base], check=True)
          code = True
          if base != '0' * 40:
              paths = subprocess.check_output(['git', 'diff', '--name-only', '-z', base, 'HEAD']).decode('utf-8').split('\0')
              code = any(path and not (path.endswith('.md') or path.startswith(('artifacts/', '.scratch/'))) for path in paths)
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'code={str(code).lower()}\n')
          print('Source/configuration changes: run native matrix' if code else 'Documentation/evidence only: skip compilation')

  validate:
    name: Fast validation
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        if: needs.preflight.outputs.code == 'true'
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Check formatting
        if: needs.preflight.outputs.code == 'true'
        run: cargo fmt --all -- --check
      - name: Check dependency boundaries and checker regressions
        run: |
          python3 scripts/check-architecture.py
          python3 scripts/check-architecture.py --self-test
      - name: Check the native test runner
        run: python3 scripts/test-native-test-runner.py

  native:
    name: Rust 1.97.1 (${{ matrix.check-name }})
    needs: preflight
    # Instantiate the matrix so documentation PRs emit the required per-OS names.
    # Skip expensive source checks at the step level; let cancelled runs stop.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # Keep per-platform status names stable as runners change.
        include:
          - os: ubuntu-24.04
            check-name: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            check-name: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            check-name: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            check-name: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - name: Require successful change classification
        if: needs.preflight.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check dependency boundaries on this platform
        run: python3 scripts/check-architecture.py
      # Hosted Linux runners have no GPU: Mesa's lavapipe is the software adapter
      # that export and the compositor tests render on there.
      - name: Install Linux window/audio dependencies and a software GPU
        if: needs.preflight.outputs.code == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libxkbcommon-dev libwayland-dev libasound2-dev mesa-vulkan-drivers
      # Media tests run against the pinned FFmpeg that packages ship, not whichever
      # version the runner's package manager has.
      - name: Fetch the shipped FFmpeg
        if: needs.preflight.outputs.code == 'true'
        run: python scripts/fetch-media-tools.py
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        if: needs.preflight.outputs.code == 'true'
        with:
          toolchain: 1.97.1
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.preflight.outputs.code == 'true'
        with:
          key: ci-${{ matrix.target }}
          cache-on-failure: true
      - name: Native backend correctness, lints and application link
        if: needs.preflight.outputs.code == 'true'
        run: python scripts/run-native-tests.py --run --target '${{ matrix.target }}' --output 'artifacts/native/backend-checks/${{ matrix.target }}'
      - name: Retain native backend evidence
        if: always() && needs.preflight.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-backend-${{ matrix.target }}
          path: artifacts/native/backend-checks/${{ matrix.target }}/
          retention-days: 14
          if-no-files-found: ignore

  latest:
    name: Latest stable compatibility (Linux)
    needs: preflight
    # Keep the job successful on documentation-only changes without compiling.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require successful change classification
        if: needs.preflight.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.preflight.outputs.code == 'true'
      - name: Install Linux build dependencies
        if: needs.preflight.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libxkbcommon-dev libwayland-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        if: needs.preflight.outputs.code == 'true'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: needs.preflight.outputs.code == 'true'
        with:
          key: ci-latest
          cache-on-failure: true
      - name: Check all targets and features with the latest compiler
        if: needs.preflight.outputs.code == 'true'
        run: cargo +stable check --profile ci --workspace --all-targets --all-features --locked

  # Require this single status in the main ruleset. Add every CI job to needs.
  check:
    name: Check
    needs: [preflight, validate, native, latest]
    # Run even after failures/cancellations; a skipped gate cannot enforce results.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
