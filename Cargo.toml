[workspace]
members = ["crates/editor-core", "crates/editor-media", "crates/editor-store", "crates/editor-agent"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[package]
name = "aster-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A native, agent-driven desktop video editor"
default-run = "aster"

[lib]
name = "aster_editor"
path = "src/lib.rs"

[[bin]]
name = "aster"
path = "src/main.rs"

[[bin]]
name = "aster-agent"
path = "src/bin/aster-agent.rs"

[[bin]]
name = "aster-mcp"
path = "src/bin/aster-mcp.rs"

[dependencies]
editor-core = { path = "crates/editor-core" }
editor-media = { path = "crates/editor-media" }
editor-store = { path = "crates/editor-store" }
editor-agent = { path = "crates/editor-agent" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
rfd = "0.17.2"
pollster = "1.0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
directories = "6"
# The MCP server (`aster-mcp`): the official Rust SDK over stdio and
# Streamable HTTP on loopback.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "io-std", "net", "signal", "sync", "time", "fs"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
schemars = { version = "1.2.1", features = ["uuid1"] }
thiserror.workspace = true

[dev-dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "process", "time"] }
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
rustix = { version = "1", features = ["event", "fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.ci]
inherits = "dev"
opt-level = 0
debug = 0
incremental = false

[profile.ci.package."*"]
opt-level = 0
